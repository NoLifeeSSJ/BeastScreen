name: Build and test
on:
  push:
    branches: [main, work]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore pinned native dependencies
        shell: pwsh
        run: ./scripts/Restore-Native.ps1
      - name: Frozen restore, build and tests
        id: build
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifacts/test-results -Force | Out-Null
          dotnet restore BeastScreen.sln --locked-mode 2>&1 | Tee-Object artifacts/test-results/restore.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build BeastScreen.sln --no-restore -c Release 2>&1 | Tee-Object artifacts/test-results/build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test tests/BeastScreen.Tests --no-build -c Release --logger "trx;LogFileName=core.trx" --results-directory artifacts/test-results
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Expose build/test failures in public annotations
        if: failure()
        shell: pwsh
        run: |
          foreach ($log in @('artifacts/test-results/restore.log','artifacts/test-results/build.log')) {
            if (Test-Path $log) { foreach ($line in (Select-String -Path $log -Pattern '(?i)(: error |error [A-Z]+[0-9]+)' | Select-Object -First 12)) { Write-Output ('::error::' + $line.Line.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')) } }
          }
          if (Test-Path artifacts/test-results/core.trx) {
            [xml]$trx = Get-Content artifacts/test-results/core.trx -Raw
            foreach ($failed in $trx.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' }) { Write-Output ('::error::' + $failed.testName + ': ' + $failed.Output.ErrorInfo.Message.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')) }
          }
      - name: Installer helper checks on PowerShell 7
        shell: pwsh
        run: |
          try { ./tests/Installer.Tests.ps1 } catch { Write-Output ('::error::' + ($_.Exception.ToString() + ' ' + $_.InvocationInfo.PositionMessage).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')); exit 1 }
      - name: Installer helper checks on Windows PowerShell 5.1
        shell: powershell
        run: |
          try { ./tests/Installer.Tests.ps1 } catch { Write-Output ('::error::' + ($_.Exception.ToString() + ' ' + $_.InvocationInfo.PositionMessage).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')); exit 1 }
      - name: Real decode and rendering smoke test on Windows Server
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          ./scripts/Generate-Fixtures.ps1
          $fixture = (Get-ChildItem artifacts/fixtures -Filter *.mkv).FullName
          $exe = (Resolve-Path src/BeastScreen.Desktop/bin/Release/net10.0-windows10.0.22000.0/win-x64/BeastScreen.exe).Path
          $result = Join-Path $PWD 'artifacts/test-results/playback.json'
          $p = Start-Process $exe -ArgumentList @('--smoke-test', ('"' + $fixture + '"'), '--result', ('"' + $result + '"')) -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Windows playback smoke timed out' }
          if ($p.ExitCode -ne 0) { if (Test-Path $result) { $text = Get-Content $result -Raw; Write-Output ('::error::' + $text.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')) }; throw 'Windows playback smoke failed' }
          $report = Get-Content $result -Raw | ConvertFrom-Json
          if (-not $report.checks.all) { throw 'Smoke test did not report all required checks' }
      - name: Self-contained package and controlled installer lifecycle
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          try {
            ./scripts/Package.ps1 -Version v0.1.0
            ./tests/Installer.Lifecycle.ps1 -PublishedApplication (Join-Path $PWD 'artifacts/publish-v0.1.0')
          } catch { Write-Output ('::error::' + ($_.Exception.ToString() + ' ' + $_.InvocationInfo.PositionMessage).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')); exit 1 }
      - name: Controlled network and codec playback integration
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $fixture = (Get-ChildItem artifacts/fixtures -Filter *.mkv).FullName
          ./scripts/Generate-ExtendedFixtures.ps1 -BaseFixture $fixture
          dotnet test tests/BeastScreen.PlaybackTests --no-build -c Release --logger "trx;LogFileName=native.trx" --results-directory artifacts/test-results
          $testExit = $LASTEXITCODE
          if ($testExit) {
            if (Test-Path artifacts/test-results/network-playback.json) { $report=Get-Content artifacts/test-results/network-playback.json -Raw; Write-Output ('::error::' + $report.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')) }
            if (Test-Path artifacts/test-results/native.trx) {
              [xml]$trx=Get-Content artifacts/test-results/native.trx -Raw
              foreach($failed in $trx.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' }){Write-Output ('::error::' + $failed.testName + ': ' + $failed.Output.ErrorInfo.Message.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A'))}
            }
            exit $testExit
          }
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-test-evidence
          path: artifacts/test-results/
          if-no-files-found: error
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Locked dependency vulnerability review
        run: |
          set -euo pipefail
          dotnet restore BeastScreen.sln --locked-mode
          dotnet list BeastScreen.sln package --vulnerable --include-transitive --format json > dependency-review.json
          python3 scripts/check-dependencies.py dependency-review.json
